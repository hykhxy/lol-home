<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>符文之地 · 英雄联盟宇宙档案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#010a13;--bg2:#091428;--panel:#0a1428;--gold:#c8aa6e;--gold2:#785a28;--gold3:#f0e6d2;--gold4:#463714;
  --teal:#0ac8b9;--teal2:#0397ab;--blue:#005a82;--text:#a09b8c;--red:#c24b46;
  --serif:"Cinzel","Noto Serif SC","Songti SC","SimSun",Georgia,serif;
  --sans:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
body{background:
  radial-gradient(1200px 500px at 50% -10%,rgba(10,200,185,.12),transparent 70%),
  radial-gradient(900px 600px at 100% 100%,rgba(0,90,130,.18),transparent 70%),var(--bg)}
button{font-family:inherit;cursor:pointer}
img{display:block}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:linear-gradient(#785a28,#463714);border-radius:4px}::-webkit-scrollbar-track{background:#050f1c}
h1,h2,h3,h4{font-family:var(--serif);color:var(--gold3);margin:0;font-weight:700;letter-spacing:.06em}
.gold-text{background:linear-gradient(#f0e6d2,#c8aa6e 60%,#a07c3c);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== 加载页 ===== */
#loading{position:fixed;inset:0;z-index:100;background:#010a13;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s,visibility .9s;overflow:hidden;user-select:none}
#loading.hide{opacity:0;visibility:hidden}
#loading .lbg{position:absolute;inset:0;background-size:cover;background-position:center 20%;opacity:.0;filter:saturate(.8) brightness(.55);transition:opacity 1.6s;transform:scale(1.06);animation:drift 24s ease-in-out infinite alternate}
#loading .lbg.on{opacity:.9}
#loading::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(1,10,19,.15) 0%,rgba(1,10,19,.78) 70%,#010a13 100%)}
@keyframes drift{to{transform:scale(1.14) translate(-1.5%,1%)}}
.lbox{position:relative;z-index:2;width:min(640px,86vw);text-align:center}
.lbox .logo{font-family:var(--serif);font-size:clamp(28px,6vw,54px);font-weight:900;letter-spacing:.18em;margin-bottom:6px}
.lbox .sub{font-size:13px;letter-spacing:.5em;color:var(--gold);margin-bottom:46px;text-indent:.5em}
.ebar{position:relative;height:22px;padding:4px;background:#050f1c;border:1px solid var(--gold2);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);box-shadow:0 0 30px rgba(200,170,110,.25)}
.ebar .fill{position:relative;height:100%;width:0%;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.0) 0 14px,rgba(255,255,255,.28) 14px 22px),linear-gradient(90deg,#785a28,#c8aa6e 50%,#f5e3b0);
  background-size:60px 100%,100% 100%;animation:roll 1s linear infinite;transition:width .25s}
@keyframes roll{to{background-position:60px 0,0 0}}
.ebar .fill::after{content:"";position:absolute;right:-6px;top:50%;width:30px;height:30px;transform:translateY(-50%);background:radial-gradient(circle,#fff 0%,rgba(255,230,160,.9) 25%,transparent 70%);filter:blur(2px);animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.55;transform:translateY(-50%) scale(1.5)}}
.lpct{margin-top:16px;font-family:var(--serif);color:var(--gold);letter-spacing:.3em;font-size:13px}
.lenter{margin-top:34px;height:30px;opacity:0;transition:opacity .8s;color:var(--gold3);font-size:15px;letter-spacing:.5em;text-indent:.5em;font-family:var(--serif)}
.lenter.on{opacity:1;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
#loading.ready{cursor:pointer}

/* ===== 顶栏 ===== */
#topbar{position:fixed;left:0;right:0;top:0;height:58px;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  background:linear-gradient(#010a13,rgba(1,10,19,.85));border-bottom:1px solid var(--gold4)}
#topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold) 70%,transparent);opacity:.6}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand .L{width:34px;height:34px;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-weight:900;color:var(--gold);transform:rotate(45deg);margin-right:6px}
.brand .L b{transform:rotate(-45deg);font-size:17px}
.brand small{display:block;font-size:10px;letter-spacing:.25em;color:var(--gold);line-height:1.2}
.brand span{font-family:var(--serif);color:var(--gold3);letter-spacing:.12em;font-size:15px}
nav.tabs{display:flex;gap:6px}
nav.tabs button{background:none;border:0;color:#a09b8c;font-family:var(--serif);letter-spacing:.14em;font-size:13px;padding:10px 16px;position:relative;font-weight:700}
nav.tabs button:hover{color:var(--gold3)}
nav.tabs button.on{color:var(--gold3)}
nav.tabs button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:3px;background:radial-gradient(ellipse at top,#f0e6d2,transparent 70%);}
nav.tabs button.on::before{content:"";position:absolute;left:50%;bottom:-8px;width:10px;height:10px;transform:translateX(-50%) rotate(45deg);background:var(--bg);border-right:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.mini{display:flex;align-items:center;gap:8px;font-size:12px}
.mini .ico{width:34px;height:34px;border:1px solid var(--gold2);background:#050f1c;color:var(--gold);font-size:14px}
.mini .ico:hover{border-color:var(--gold);color:var(--gold3)}
.mini .nm{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gold3)}

/* ===== 视图 ===== */
main{position:fixed;inset:58px 0 0 0}
.view{position:absolute;inset:0;display:none;overflow:auto}
.view.on{display:block;animation:fadein .5s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
.wrap{max-width:1500px;margin:0 auto;padding:22px 24px 50px}

/* 主页 */
#view-home{overflow:hidden}
.home{height:100%;display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,3.3fr) minmax(150px,1fr);gap:14px;padding:14px 18px;align-items:stretch}
.side{display:flex;flex-direction:column;gap:14px;justify-content:center;align-items:center;min-height:0}
.tile{position:relative;width:min(100%,calc((100vh - 58px - 28px - 14px)/2));aspect-ratio:1;border:1px solid var(--gold2);background:#050f1c;overflow:hidden;cursor:pointer;padding:0;color:inherit;text-align:left;transition:.35s}
.tile::before{content:"";position:absolute;inset:4px;border:1px solid rgba(200,170,110,.35);z-index:3;pointer-events:none;transition:.35s}
.tile .bgi{position:absolute;inset:0;background-size:cover;background-position:center 18%;filter:saturate(.85) brightness(.62);transition:.6s}
.tile:hover{border-color:var(--gold);box-shadow:0 0 28px rgba(200,170,110,.35)}
.tile:hover .bgi{transform:scale(1.08);filter:saturate(1.1) brightness(.85)}
.tile:hover::before{inset:7px;border-color:var(--gold)}
.tile .num{position:absolute;top:10px;left:14px;font-family:var(--serif);font-size:44px;font-weight:900;color:rgba(240,230,210,.28);z-index:2;line-height:1}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 16px;z-index:2;background:linear-gradient(transparent,rgba(1,10,19,.95))}
.tile .cap h3{font-size:clamp(15px,1.6vw,22px)}
.tile .cap p{margin:4px 0 0;font-size:12px;color:var(--gold);letter-spacing:.14em;font-family:var(--serif)}
.tile.bgm{cursor:default}
.bgm .cover{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.5) saturate(.9);transition:background-image .6s}
.bgm .ctl{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:10px 14px 14px;background:linear-gradient(transparent,rgba(1,10,19,.96) 40%)}
.bgm .ttl{font-family:var(--serif);color:var(--gold3);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgm .art{font-size:11px;color:var(--gold);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgm .btns{display:flex;align-items:center;justify-content:space-between;gap:6px}
.bgm .btns button,.mini button{background:#050f1c;border:1px solid var(--gold2);color:var(--gold);width:32px;height:32px;display:grid;place-items:center;font-size:13px;padding:0}
.bgm .btns button:hover{border-color:var(--gold);color:var(--gold3)}
.bgm .btns .pp{width:42px;height:42px;border-radius:50%;border-color:var(--gold);font-size:16px}
.bgm .prog{height:3px;background:#1e2328;margin:8px 0 2px;cursor:pointer;position:relative}
.bgm .prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--gold2),var(--gold3));width:0}
.bgm .disc{position:absolute;top:12px;right:12px;width:25%;aspect-ratio:1;border-radius:50%;border:2px solid var(--gold);background-size:cover;z-index:4;animation:spin 14s linear infinite;animation-play-state:paused;box-shadow:0 0 18px #000}
.bgm.playing .disc{animation-play-state:running}
.bgm .disc::after{content:"";position:absolute;inset:40%;border-radius:50%;background:var(--bg);border:1px solid var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}
.bgm .list{position:absolute;inset:0;z-index:6;background:rgba(1,10,19,.96);overflow:auto;padding:10px;display:none}
.bgm .list.on{display:block}
.bgm .list div{display:flex;gap:8px;align-items:center;padding:6px;cursor:pointer;border-bottom:1px solid #1e2328;font-size:12px;color:var(--text)}
.bgm .list div:hover,.bgm .list div.cur{background:rgba(200,170,110,.12);color:var(--gold3)}
.bgm .list img{width:32px;height:32px;object-fit:cover}
.bgm .list b{display:block;font-weight:500}.bgm .list small{color:var(--gold);font-size:10px}

/* 世界地图 */
.mapbox{position:relative;min-height:0;border:1px solid var(--gold);background:#030c16;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.6),inset 0 0 80px rgba(0,0,0,.7)}
.mapbox::before,.mapbox::after{content:"";position:absolute;z-index:8;pointer-events:none;width:64px;height:64px;border:2px solid var(--gold)}
.mapbox::before{left:6px;top:6px;border-right:0;border-bottom:0}
.mapbox::after{right:6px;bottom:6px;border-left:0;border-top:0}
.maphead{position:absolute;left:0;right:0;top:0;z-index:7;padding:14px 22px;pointer-events:none;background:linear-gradient(rgba(1,10,19,.9),transparent)}
.maphead h2{font-size:clamp(16px,2vw,24px)}.maphead p{margin:4px 0 0;font-size:11px;color:var(--gold);letter-spacing:.3em;font-family:var(--serif)}
#mapStage{position:absolute;left:0;top:0;transform-origin:0 0;touch-action:none;will-change:transform;background:#0b1c26}
#mapStage .mapimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
#mapStage .mapfallback{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#10303a,#050f1c 70%)}
#mapStage .glow{position:absolute;width:11%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:.5;mix-blend-mode:screen}
.pin{position:absolute;transform:translate(-50%,-50%) scale(calc(1 / var(--s,1)));transform-origin:center;border:0;background:none;padding:0;z-index:5;display:flex;flex-direction:column;align-items:center}
.pin .face{width:46px;height:46px;border-radius:50%;border:2px solid var(--c,#c8aa6e);background:#050f1c center/cover;box-shadow:0 0 0 2px #010a13,0 0 16px var(--c,#c8aa6e),0 4px 12px #000;transition:.25s;position:relative}
.pin .face::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed var(--c,#c8aa6e);opacity:.6;animation:spin 16s linear infinite}
.pin .lab{margin-top:6px;white-space:nowrap;font-family:var(--serif);font-size:13px;font-weight:700;color:var(--gold3);text-shadow:0 0 6px #000,0 0 3px #000,0 1px 2px #000;background:rgba(1,10,19,.55);padding:1px 8px;border:1px solid rgba(200,170,110,.3)}
.pin:hover .face,.pin.on .face{transform:scale(1.2);box-shadow:0 0 0 2px #010a13,0 0 26px var(--c),0 4px 12px #000}
.pin:hover,.pin.on{z-index:9}
.mapctl{position:absolute;left:16px;bottom:16px;z-index:8;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;background:rgba(5,15,28,.9);border:1px solid var(--gold2);color:var(--gold);font-size:20px;padding:0}
.mapctl button:hover{border-color:var(--gold);color:var(--gold3)}
.maphint{position:absolute;right:20px;bottom:14px;z-index:7;font-size:11px;color:#8a8574;pointer-events:none;letter-spacing:.1em}
.rpanel{position:absolute;right:0;top:0;bottom:0;width:min(350px,92%);z-index:10;background:linear-gradient(90deg,rgba(1,10,19,.0),rgba(1,10,19,.97) 14%);padding:22px 20px 20px 34px;overflow:auto;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.rpanel.on{transform:none}
.rpanel .x{position:absolute;right:12px;top:12px;width:32px;height:32px;background:#050f1c;border:1px solid var(--gold2);color:var(--gold);font-size:16px;padding:0}
.rpanel .en{font-family:var(--serif);font-size:11px;letter-spacing:.35em;color:var(--c,var(--gold));margin-top:4px}
.rpanel h2{font-size:28px;margin-top:6px}
.rpanel .mt{font-style:italic;color:var(--gold);font-size:13px;margin:8px 0 12px;font-family:var(--serif)}
.rpanel p{font-size:13px;line-height:1.85;margin:0 0 12px}
.rpanel h4{font-size:13px;color:var(--gold);letter-spacing:.2em;margin:14px 0 8px;border-bottom:1px solid var(--gold4);padding-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border:1px solid var(--gold2);color:var(--gold);font-size:12px;background:rgba(200,170,110,.06)}
.chrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.chav{cursor:pointer;text-align:center;font-size:11px;color:var(--text);background:none;border:0;padding:0}
.chav img{width:100%;aspect-ratio:1;border:1px solid var(--gold2);object-fit:cover;transition:.2s;background:#050f1c}
.chav:hover img{border-color:var(--gold3);transform:translateY(-2px)}
.chav span{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn{display:inline-block;padding:11px 24px;background:linear-gradient(#1e2328,#0a1428);border:1px solid var(--gold2);color:var(--gold3);font-family:var(--serif);letter-spacing:.14em;font-size:13px;font-weight:700;position:relative;transition:.25s;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%)}
.btn:hover{background:linear-gradient(#3a3020,#1b1608);border-color:var(--gold);color:#fff}
.btn.gold{background:linear-gradient(#c8aa6e,#785a28);color:#1a1205;border-color:var(--gold3)}
.btn.gold:hover{background:linear-gradient(#f0e6d2,#c8aa6e);color:#000}
.btn[disabled]{opacity:.4;pointer-events:none;filter:grayscale(1)}
.btn.sm{padding:7px 16px;font-size:12px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* 通用页头 */
.vhead{text-align:center;padding:12px 0 26px;position:relative}
.vhead .big{font-family:var(--serif);font-size:clamp(40px,7vw,86px);font-weight:900;color:rgba(240,230,210,.14);line-height:1}
.vhead h1{font-size:clamp(22px,3.5vw,38px);margin-top:-22px;position:relative}
.vhead p{color:var(--gold);letter-spacing:.3em;font-size:12px;margin:8px 0 0;font-family:var(--serif)}
.vhead::after{content:"";display:block;width:min(560px,80%);height:1px;margin:20px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* 时间线 */
.tl{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:26px;align-items:start}
.tlrail{position:relative;padding-left:34px;max-height:calc(100vh - 290px);overflow:auto;padding-right:10px}
.tlrail::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;background:linear-gradient(var(--gold),var(--gold2) 60%,transparent)}
.node{position:relative;margin-bottom:14px;padding:12px 14px;border:1px solid var(--gold4);background:rgba(9,20,40,.7);cursor:pointer;transition:.25s;display:block;width:100%;text-align:left;color:inherit}
.node::before{content:"";position:absolute;left:-30px;top:20px;width:12px;height:12px;background:var(--bg);border:2px solid var(--gold2);transform:rotate(45deg);transition:.25s}
.node:hover{border-color:var(--gold2)}
.node.on{border-color:var(--gold);background:rgba(200,170,110,.1);box-shadow:0 0 22px rgba(200,170,110,.2)}
.node.on::before{background:var(--gold);box-shadow:0 0 14px var(--gold)}
.node .era{font-size:11px;color:var(--gold);letter-spacing:.25em;font-family:var(--serif)}
.node h4{font-size:16px;margin-top:3px}
.node .av{display:flex;margin-top:8px}
.node .av img{width:26px;height:26px;border-radius:50%;border:1px solid var(--gold2);margin-right:-6px;background:#050f1c}
.tdetail{position:sticky;top:0;border:1px solid var(--gold2);background:#050f1c;overflow:hidden;min-height:460px}
.tdetail .hero{height:300px;background-size:cover;background-position:center 20%;position:relative}
.tdetail .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,#050f1c)}
.tdetail .body{padding:0 26px 26px;margin-top:-80px;position:relative;z-index:2}
.tdetail .era{font-size:12px;color:var(--gold);letter-spacing:.3em;font-family:var(--serif)}
.tdetail h2{font-size:30px;margin:6px 0 12px}
.tdetail p{font-size:14px;line-height:1.95;margin:0 0 14px;color:#b8b3a4}
.dest{margin-top:20px;border-top:1px solid var(--gold4);padding-top:16px}
.dest h4{font-size:13px;color:var(--gold);letter-spacing:.25em;margin-bottom:10px}
.rchip{padding:6px 12px;border:1px solid var(--gold4);background:rgba(9,20,40,.8);color:var(--text);font-size:13px;display:flex;gap:6px;align-items:center;transition:.2s}
.rchip i{width:9px;height:9px;transform:rotate(45deg);background:var(--c)}
.rchip:hover{border-color:var(--gold2);color:var(--gold3)}
.rchip.on{border-color:var(--gold);color:var(--gold3);background:rgba(200,170,110,.14);box-shadow:0 0 12px rgba(200,170,110,.3)}
.note{font-size:11px;color:#6d6a60;margin-top:12px;line-height:1.7}

/* 图鉴 */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:14px}
.rtabs{display:flex;gap:2px;flex-wrap:wrap}
.rtabs button{background:none;border:0;border-bottom:2px solid transparent;color:#a09b8c;padding:8px 12px;font-size:13px;font-family:var(--serif);font-weight:700}
.rtabs button small{opacity:.6;margin-left:4px;font-family:var(--sans);font-weight:400}
.rtabs button:hover{color:var(--gold3)}
.rtabs button.on{color:var(--gold3);border-color:var(--gold)}
.inp{background:#050f1c;border:1px solid var(--gold2);color:var(--gold3);padding:9px 12px;font-size:14px;font-family:var(--sans);outline:none;width:100%}
.inp:focus{border-color:var(--gold);box-shadow:0 0 12px rgba(200,170,110,.25)}
textarea.inp{resize:vertical;min-height:90px;line-height:1.7}
select.inp{appearance:auto}
.sel-sm{width:auto;min-width:130px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.card{position:relative;aspect-ratio:308/560;border:1px solid var(--gold4);background:#050f1c;cursor:pointer;overflow:hidden;padding:0;text-align:left;color:inherit;transition:.3s}
.card img.im{width:100%;height:100%;object-fit:cover;transition:.5s;filter:saturate(.9)}
.card:hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 24px rgba(200,170,110,.3)}
.card:hover img.im{transform:scale(1.07);filter:saturate(1.15)}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 10px 10px;background:linear-gradient(transparent,rgba(1,10,19,.96))}
.card .cap b{display:block;font-family:var(--serif);color:var(--gold3);font-size:15px}
.card .cap span{font-size:11px;color:var(--gold)}
.card .tier{position:absolute;top:8px;right:8px;font-family:var(--serif);font-weight:900;font-size:12px;padding:2px 7px;background:rgba(1,10,19,.85);border:1px solid var(--gold2);color:var(--gold3)}

const MAPS={s:1,tx:0,ty:0,W:0,H:0,pts:new Map(),moved:false};
function initMapImg(){
  const img=$('#mapimg');
  img.onerror=()=>{img.style.display='none'};

function renderMap(){
  const st=$('#mapStage');$$('.pin,.glow',st).forEach(e=>e.remove());
  REGIONS.filter(r=>r.x!=null).forEach(r=>{
    const g=document.createElement('div');g.className='glow';g.style.cssText=`left:${r.x}%;top:${r.y}%;background:radial-gradient(circle,${r.c}88,transparent 68%)`;st.appendChild(g);
    const b=document.createElement('button');b.className='pin';b.dataset.id=r.id;b.style.cssText=`left:${r.x}%;top:${r.y}%;--c:${r.c}`;
    b.innerHTML=`<div class="face" style="background-image:url(${IMG.icon(r.face)})"></div><div class="lab">${r.n}</div>`;
    b.addEventListener('click',e=>{if(MAPS.moved)return;openRegion(r.id)});
    st.appendChild(b);
  });
  fitMap();
}
function fitMap(){
  const box=$('#mapbox');const W=box.clientWidth,H=box.clientHeight;if(!W||!H)return;
  const first=!MAPS.W; MAPS.W=W;MAPS.H=H;
  const st=$('#mapStage');
  const size=Math.max(W,H*1.05);
  st.style.width=size+'px';st.style.height=size+'px';MAPS.size=size;
  if(first||!MAPS.init){MAPS.init=true;MAPS.s=1;MAPS.tx=(W-size)/2;MAPS.ty=H/2-size*0.57}
  applyMap();
}
function applyMap(){
  const {s,size,W,H}=MAPS;const sz=size*s;
  MAPS.tx=Math.min(0,Math.max(W-sz,MAPS.tx));MAPS.ty=Math.min(0,Math.max(H-sz,MAPS.ty));
  const st=$('#mapStage');st.style.transform=`translate(${MAPS.tx}px,${MAPS.ty}px) scale(${s})`;st.style.setProperty('--s',s);
}
function zoomAt(f,cx,cy){
  const o=MAPS.s;const n=Math.min(4,Math.max(1,o*f));if(n===o)return;
  MAPS.tx=cx-(cx-MAPS.tx)*(n/o);MAPS.ty=cy-(cy-MAPS.ty)*(n/o);MAPS.s=n;applyMap();
}
(function mapEvents(){
  const box=$('#mapbox');
  box.addEventListener('wheel',e=>{if(e.target.closest('.rpanel'))return;e.preventDefault();const r=box.getBoundingClientRect();zoomAt(e.deltaY<0?1.18:1/1.18,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  let last=null,pd=0;
  box.addEventListener('pointerdown',e=>{if(e.target.closest('.rpanel,.mapctl'))return;MAPS.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});MAPS.moved=false;last={x:e.clientX,y:e.clientY};if(MAPS.pts.size===2){const p=[...MAPS.pts.values()];pd=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}});
  window.addEventListener('pointermove',e=>{
    if(!MAPS.pts.has(e.pointerId))return;MAPS.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(MAPS.pts.size===2){const p=[...MAPS.pts.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pd){const r=box.getBoundingClientRect();zoomAt(d/pd,(p[0].x+p[1].x)/2-r.left,(p[0].y+p[1].y)/2-r.top)}pd=d;MAPS.moved=true;return}
    const dx=e.clientX-last.x,dy=e.clientY-last.y;
    if(Math.abs(dx)+Math.abs(dy)>3)MAPS.moved=true;
    if(MAPS.moved){MAPS.tx+=dx;MAPS.ty+=dy;applyMap()}
    last={x:e.clientX,y:e.clientY};
  });
  const up=e=>{MAPS.pts.delete(e.pointerId);pd=0;setTimeout(()=>MAPS.moved=false,60)};
  window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  $('#zin').onclick=()=>zoomAt(1.4,MAPS.W/2,MAPS.H/2);
  $('#zout').onclick=()=>zoomAt(1/1.4,MAPS.W/2,MAPS.H/2);
  $('#zreset').onclick=()=>{MAPS.s=1;MAPS.tx=(MAPS.W-MAPS.size)/2;MAPS.ty=MAPS.H/2-MAPS.size*0.57;applyMap();closeRegion()};
  window.addEventListener('resize',()=>{if(view==='home')fitMap()});
})();

function avSay(t,k){const e=$('#avMsg');if(e){e.textContent=t;e.className='avmsg'+(k?' '+k:'')}S.cr.avMsg=t}

function avCopy(t){const ok=()=>toast('已复制，回聊天粘贴发送即可');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(ok,()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();ok()})}
function avSquash(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const s=Math.min(im.width,im.height),S2=Math.min(512,s),cv=document.createElement('canvas');cv.width=cv.height=S2;
    cv.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)*0.3,s,s,0,0,S2,S2);URL.revokeObjectURL(u);
    cv.toBlob(b=>b?res(b):rej(new Error('压缩失败')),'image/png')};
  im.onerror=()=>rej(new Error('读不了这张图片'));im.src=u})}
async function avImgur(b){const f=new FormData();f.append('image',b);const r=await fetch('https://api.imgur.com/3/image',{method:'POST',headers:{Authorization:'Client-ID 546c25a59c58ad7'},body:f});const j=await r.json();if(!j.success)throw new Error('imgur');return j.data.link}
async function avLitter(b){const f=new FormData();f.append('reqtype','fileupload');f.append('time','72h');f.append('fileToUpload',b,'a.png');const r=await fetch('https://litterbox.catbox.moe/resources/internals/api.php',{method:'POST',body:f});const t=(await r.text()).trim();if(!/^https:/.test(t))throw new Error('litterbox');return t}
async function avUpload(file){
  if(!file||!/^image\//.test(file.type))return avSay('请选择图片文件','er');
  avSay('压缩中…');let blob;try{blob=await avSquash(file)}catch(e){return avSay(e.message,'er')}
  avSay('上传到公开图床…（几秒）');let link='',note='';
  try{link=await avImgur(blob);note='已上传到 imgur，永久链接'}catch(e){try{link=await avLitter(blob);note='imgur 不可用，已上传到 litterbox（72 小时有效）'}catch(e2){}}
  if(!link)return avSay('图床都连不上：请换个网络，或切到「填写外链」粘贴你自己的图片链接','er');
  S.cr.avDraft=link;const i=$('#avLink');if(i)i.value=link;
  const pv=$('#avImg');if(pv){pv.src=link}
  avSay('上传成功 ✓ '+note+'。点「保存头像」生效','ok');
}
function renderAvSrc(){
  const c=S.cr,box=$('#avBox');if(!box)return;
  $$('#avMode button').forEach(b=>b.classList.toggle('on',b.dataset.m===c.avMode));
  if(c.avMode==='champ'){box.innerHTML=`<div class="note">使用上方所选的英雄立绘（可用 ‹ › 或「选择立绘」更换）。想用自己的图，切到「本地上传」或「填写外链」。</div>`}
  else{
    box.innerHTML=(c.avMode==='up'?`<label class="avdrop" id="avDrop"><b>＋</b>点击选择 / 拖入本地图片<small>自动裁成正方形并上传到公开图床，得到链接</small><input type="file" id="avFile" accept="image/*" hidden></label>`:'')
     +`<div class="avmsg" id="avMsg">${esc(c.avMsg||'')}</div>
      <input class="inp" id="avLink" placeholder="${c.avMode==='up'?'上传成功后链接会自动填在这里':'粘贴公开图片链接 https://…'}" value="${esc(c.avDraft||'')}">
      <div class="btnrow"><button class="btn sm gold" id="avSave">保存头像</button><button class="btn sm" id="avClear">恢复立绘</button>${c.avUrl?'<button class="btn sm" id="avCp">复制「换头像」指令</button>':''}</div>`;
    const dz=$('#avDrop'),fi=$('#avFile');
    if(dz){fi.onchange=e=>avUpload(e.target.files[0]);
      ['dragover','dragenter'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('on')}));
      ['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('on')}));
      dz.addEventListener('drop',e=>avUpload(e.dataTransfer.files[0]))}
    $('#avLink').oninput=e=>{c.avDraft=e.target.value.trim()};
    $('#avSave').onclick=()=>{const u=($('#avLink').value||'').trim();
      if(!/^https?:\/\//.test(u))return avSay(c.avMode==='up'?'先上传图片，或在下方粘贴 https:// 开头的链接':'请粘贴 https:// 开头的图片链接','er');
      const t=new Image();t.onload=()=>{c.avUrl=c.avDraft=u;try{localStorage.setItem('lol-cr-avatar',JSON.stringify({url:u,mode:c.avMode}))}catch(e){}
        c.avMsg='已保存 ✓ 头像已更换';renderAvatar();refreshCreate();toast('头像已保存');};
      t.onerror=()=>avSay('这个链接打不开图片，请检查（需要是公开的图片直链）','er');t.src=u};
    $('#avClear').onclick=()=>{c.avUrl=c.avDraft=c.avMsg='';c.avMode='champ';try{localStorage.removeItem('lol-cr-avatar')}catch(e){}renderAvatar();refreshCreate()};
    const cp=$('#avCp');if(cp)cp.onclick=()=>avCopy(avCmd());
  }
}

async function openItems(){

}
function rollTalents(reset){
  const c=S.cr;const pool=[...TALENTS];const out=[];
  const total=Object.values(QUAL).reduce((a,q)=>a+q.w,0);
  while(out.length<10&&pool.length){
    let r=Math.random()*total,key='w';for(const [k,q] of Object.entries(QUAL)){r-=q.w;if(r<=0){key=k;break}}
    const cand=pool.filter(t=>t[0]===key);const t=cand.length?pick(cand):pick(pool);
    pool.splice(pool.indexOf(t),1);out.push(t);
  }
  const order='rgpbw';out.sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0]));
  c.rolled=out;if(reset)c.picked=[];
}
function renderTalents(){
  const c=S.cr;
  $('#tgrid').innerHTML=c.rolled.map((t,i)=>{const q=QUAL[t[0]];return `<button class="tcard ${c.picked.includes(i)?'sel':''}" data-i="${i}" style="--q:${q.c};animation-delay:${i*50}ms"><div class="q">${q.n.toUpperCase()}</div><h4>${t[1]}</h4><p>${t[2]}</p><div class="at">${Object.entries(t[3]).filter(([,v])=>v).map(([k,v])=>k+(v>0?'+':'')+v).join('　')}</div></button>`}).join('');
  $('#tgrid').onclick=e=>{const b=e.target.closest('.tcard');if(!b)return;const i=+b.dataset.i;const p=c.picked.indexOf(i);if(p>=0)c.picked.splice(p,1);else if(c.picked.length<2)c.picked.push(i);else{c.picked.shift();c.picked.push(i)}renderTalents();refreshCreate()};
}
function cardText(){
  const c=S.cr,a=crAttrs(),ch=S.CH[c.champ];
  const tal=c.picked.map(i=>c.rolled[i]).map(t=>`【${QUAL[t[0]].n}】${t[1]}：${t[2]}`).join('\n');
  const items=c.items.map(id=>(S.items||[]).find(i=>i.id===id)?.name||('装备#'+id)).join('、');
  return `【英雄联盟 · 角色卡】\n姓名：${c.name}\n性别：${c.gender}\n年龄：${c.age}\n种族：${RACES[c.race].n}（${RACES[c.race].en}）\n核心性格：${[...c.traits,c.trait2.trim()].filter(Boolean).join('、')}\n出生地：${c.region?RMAP[c.region].n:'—'}\n时代：${c.era||'—'}\n背景出身：${c.origin||'—'}\n特殊设定：${c.special||'—'}${items?'\n装备道具：'+items:''}\n天赋：\n${tal}\n属性：${ATTRS.map(k=>k+a[k]).join(' ')}\n立绘：${ch?.name||c.champ}${c.avUrl?'\n头像链接：'+c.avUrl+'\n'+avCmd():''}`;
}
function showCard(){
  const c=S.cr,a=crAttrs(),ch=S.CH[c.champ];
  openModal(`<div class="mhead"><h3 class="gold-text">角色创建完成</h3></div>
   <div class="cardsheet"><div><div class="portrait" style="background-image:url(${c.avUrl?esc(c.avUrl):IMG.splash(c.champ,c.skin)})"></div><div class="note" style="text-align:center">${c.avUrl?'头像：自定义':'立绘：'+esc(ch?.name||'')}</div></div>
   <div><dl><dt>姓名</dt><dd>${esc(c.name)}</dd><dt>性别 / 年龄</dt><dd>${esc(c.gender)} / ${esc(c.age)}</dd><dt>种族</dt><dd>${RACES[c.race].n}（${RACES[c.race].en}）</dd>
   <dt>核心性格</dt><dd>${esc([...c.traits,c.trait2.trim()].filter(Boolean).join('、'))}</dd><dt>出生地 / 时代</dt><dd>${c.region?RMAP[c.region].n:'—'} · ${esc(c.era||'—')}</dd>
   <dt>背景出身</dt><dd>${esc(c.origin||'—')}</dd><dt>特殊设定</dt><dd>${esc(c.special||'—')}</dd>
   <dt>装备道具</dt><dd>${c.items.length?c.items.map(id=>`<img src="${IMG.item(id)}" style="display:inline-block;width:34px;height:34px;margin-right:4px;border:1px solid var(--gold2)">`).join(''):'—'}</dd>
   <dt>天赋</dt><dd>${c.picked.map(i=>c.rolled[i]).map(t=>`<span style="color:${QUAL[t[0]].c}">【${QUAL[t[0]].n}】${t[1]}</span> — ${t[2]}`).join('\n')}</dd>
   <dt>属性</dt><dd>${ATTRS.map(k=>k+' '+a[k]).join('　')}</dd></dl>
   <div class="btnrow"><button class="btn gold" id="cpy">复制角色卡文本</button><button class="btn" onclick="closeModal()">返回修改</button></div></div></div>`);
  $('#cpy').onclick=()=>{const t=cardText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('已复制角色卡'),()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('已复制角色卡')})};
}
